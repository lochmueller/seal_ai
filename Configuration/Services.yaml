services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Lochmueller\SealAi\:
    resource: '../Classes/*'
    exclude:
      # Built per site by the AiBridgeFactory / AiAdapterFactory, never shared services
      - '../Classes/AiBridge.php'
      - '../Classes/Adapter/Ai/AiAdapter.php'
      - '../Classes/Adapter/Ai/AiIndexer.php'
      - '../Classes/Adapter/Ai/AiSchemaManager.php'
      - '../Classes/Adapter/Ai/AiSearcher.php'
      # Registered in Services.php, only if the optional packages are installed
      - '../Classes/Integration/Aim/*'
      - '../Classes/Integration/Mcp/*'

  cache.seal_ai_embedding:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['seal_ai_embedding']

  Lochmueller\SealAi\Factory\AiBridgeFactory:
    arguments:
      $embeddingCache: '@cache.seal_ai_embedding'
